name: Build JW DJ Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack JW DJ Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q UPLOAD-THIS-JW-DJ.zip -d project
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir apk
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk/JW-DJ-Uploader-V12.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JW-DJ-Uploader-V12.1-APK
          path: apk/JW-DJ-Uploader-V12.1.apk
          if-no-files-found: error
          retention-days: 7
