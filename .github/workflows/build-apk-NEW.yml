name: Build JW DJ Android APK NEW

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack JW DJ Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q UPLOAD-THIS-JW-DJ.zip -d project
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Switch project to Android API 36
        run: |
          sed -i 's/compileSdk 37/compileSdk 36/' "$PROJECT_DIR/app/build.gradle"
          sed -i 's/targetSdk 37/targetSdk 36/' "$PROJECT_DIR/app/build.gradle"
          grep -nE 'compileSdk|targetSdk' "$PROJECT_DIR/app/build.gradle"

      - name: Install Android API 36 and Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk/JW-DJ-Uploader-V12.1.apk
          ls -lh apk/JW-DJ-Uploader-V12.1.apk
          sha256sum apk/JW-DJ-Uploader-V12.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JW-DJ-Uploader-V12.1-APK
          path: apk/JW-DJ-Uploader-V12.1.apk
          if-no-files-found: error
          retention-days: 7
